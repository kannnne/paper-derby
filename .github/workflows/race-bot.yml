name: race-bot

# GitHub's cron is unreliable (often hours late), so one run loops `python -m hkjc tick`
# every 5 minutes for ~5.5 h and then dispatches the next run itself (24/7 chain).
# The hourly schedule is only a backup in case the chain ever breaks.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "loop | tick | scores | live | post | probe | report"
        required: false
        default: "loop"

concurrency:
  group: race-bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  issues: write

env:
  TZ: Asia/Hong_Kong
  HKJC_CLOUD: "1"
  PYTHONUNBUFFERED: "1"
  GH_TOKEN: ${{ github.token }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Git identity
        run: |
          git config user.name "Paper Derby Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Restore database from text dump
        run: python -m hkjc.dbdump load data/db data/hkjc.db
      - name: Probe HKJC connectivity
        if: ${{ github.event.inputs.command == 'probe' }}
        run: PYTHONPATH=. python scripts/probe_hkjc.py
      - name: Loop (tick every 5 min, ~5.5 h, then chain the next run)
        if: ${{ github.event_name == 'schedule' || github.event.inputs.command == 'loop' || github.event.inputs.command == '' }}
        run: python scripts/cloud_loop.py loop --minutes 330 --interval 5
      - name: One command
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.command != 'loop' && github.event.inputs.command != '' && github.event.inputs.command != 'probe' }}
        run: python scripts/cloud_loop.py once "${{ github.event.inputs.command }}"
      - name: Show log
        if: always()
        run: tail -n 60 data/logs/hkjc.log 2>/dev/null || true
