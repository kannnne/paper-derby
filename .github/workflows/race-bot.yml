name: race-bot

on:
  schedule:
    # every 30 min, 08:00–01:59 HKT (UTC 00:00–17:59); covers day + night meetings
    - cron: "*/30 0-17 * * *"
  workflow_dispatch:
    inputs:
      command:
        description: "tick | probe | report | post"
        required: false
        default: "tick"

concurrency:
  group: race-bot
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

env:
  TZ: Asia/Hong_Kong
  HKJC_CLOUD: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Restore database from text dump
        run: python -m hkjc.dbdump load data/db data/hkjc.db
      - name: Probe HKJC connectivity
        if: ${{ github.event.inputs.command == 'probe' }}
        run: PYTHONPATH=. python scripts/probe_hkjc.py
      - name: Run
        if: ${{ github.event.inputs.command != 'probe' }}
        run: python -m hkjc ${{ github.event.inputs.command || 'tick' }}
      - name: Show log
        if: always()
        run: tail -n 40 data/logs/hkjc.log 2>/dev/null || true
      - name: Dump database
        if: ${{ github.event.inputs.command != 'probe' }}
        run: python -m hkjc.dbdump dump data/hkjc.db data/db
      - name: Commit changes
        id: commit
        if: ${{ github.event.inputs.command != 'probe' }}
        run: |
          git config user.name "Paper Derby Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/db reports site data/bot_backtest.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -q -m "bot: $(date '+%Y-%m-%d %H:%M') HKT"
            git pull --rebase -q || true
            git push -q
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload site
        if: ${{ steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: run
    if: ${{ needs.run.outputs.changed == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
